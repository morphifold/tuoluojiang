services:
  tuoluojiang:
    image: ccr.ccs.tencentyun.com/tuoluojiang/tuoluojiangky:latest
    container_name: tuoluojiang-oa
    restart: unless-stopped
    ports:
      - "8088:80"
      - "127.0.0.1:3376:3306"
      - "127.0.0.1:6389:6379"
      - "127.0.0.1:20300:20200"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./apps/oa-backend:/var/www
      - tuoluojiang_mysql_data:/var/lib/mysql
      - tuoluojiang_redis_data:/var/lib/redis
      - ./nginx_default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  tuoluojiang_mysql_data:
    name: tuoluojiang_mysql_data
  tuoluojiang_redis_data:
    name: tuoluojiang_redis_data
