services:
  # mysql 容器
  mysql_tuoluojiang:
    container_name: mysql_tuoluojiang #指定容器名
#    image: daocloud.io/library/mysql:5.7.5-m15 #M1芯片可以采用这个镜像
    image: docker.1ms.run/mysql:8.0 #一般电脑可以用这个镜像
    ports:
      - 3376:3306
    # 环境变量
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: 'tuoluojiang'
      MYSQL_USER: 'tuoluojiang'
      MYSQL_PASSWORD: '123456'
    privileged: true
    command:
       --character-set-server=utf8mb4
       --collation-server=utf8mb4_general_ci
       --explicit_defaults_for_timestamp=true
       --lower_case_table_names=1
       --max_allowed_packet=128M
       --default-authentication-plugin=mysql_native_password
       --sql-mode="NO_ENGINE_SUBSTITUTION"
    working_dir: /var/lib/mysql
    volumes:
      - ./help/docker-compose/mysql/my.cnf:/etc/mysql/my.cnf
      - ./help/docker-compose/mysql/data:/var/lib/mysql #挂载数据目录到本地
      - ./help/docker-compose/mysql/log:/var/log/mysql
    networks:
      app_net:
        # 固定子网ip，网段必须在子网络192.168.*.*
        ipv4_address: 192.168.10.14
  # redis 容器
  redis_tuoluojiang:
    container_name: redis_tuoluojiang
    image: 'docker.1ms.run/redis:latest'
    ports:
      - "6389:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./help/docker-compose/redis/data:/data #挂载数据目录到本地
      - ./help/docker-compose/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      app_net:
        ipv4_address: 192.168.10.15
  # php 容器
  tuoluojiang:
    container_name: tuoluojiang #指定容器名
    # image: tuoluojiang #指定镜像名
    build:
      context: ./help/docker-compose/php #dockerfile文件路径
      dockerfile: Dockerfile #制定dockerfile文件名称
    restart: always
    environment:
      TZ: Asia/Shanghai
      # 数据库配置环境变量
      MYSQL_HOST_IP: mysql_tuoluojiang
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: tuoluojiang
      # Redis配置环境变量
      REDIS_HOST_IP: redis_tuoluojiang
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: "123456"
      # 应用配置环境变量
      APP_DEBUG: true
      DEFAULT_TIMEZONE: Asia/Shanghai
    ports:
      - 20300:20200
    tmpfs: /var/temp #上传临时文件夹
    working_dir: /var/www
    volumes:
      - ./code:/var/www #程序运行目录
      - ./code/storage:/var/www/temp #程序缓存目录
      - ./help/docker-compose/php/php-ini-overrides.ini:/etc/php/8.0/fpm/conf.d/99-overrides.ini
    command: bin/laravels start --ignore
    networks:
      app_net:
        ipv4_address: 192.168.10.16
    
  nginx_tuoluojiang:
    container_name: nginx_tuoluojiang
    image: docker.1ms.run/nginx:latest
    # platform: linux/arm64/v8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./code:/var/www
      - ./help/docker-compose/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./help/docker-compose/nginx/conf.d:/etc/nginx/conf.d
      - ./help/docker-compose/nginx/log:/var/log/nginx
    networks:
      app_net:
        ipv4_address: 192.168.10.17
    restart: unless-stopped
    depends_on:
      - tuoluojiang
networks: #网络配置
  app_net: #网络名称
    driver: bridge
    ipam: #网络配置
      driver: default
      config:
        - subnet: 192.168.10.0/24 #IP区间

