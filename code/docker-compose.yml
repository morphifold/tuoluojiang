services:
  # mysql 容器
  mysql:
    container_name: tuoluojiang_mysql
    image: ccr.ccs.tencentyun.com/tuoluojiang/mysql:latest
    # build: ./mysql
    # 平台兼容性配置
    # platform: linux/amd64
    ports:
      - "33061:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: tuoluojiang
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: tuoluojiang
    volumes:
      # - ./mysql/my.cnf:/etc/mysql/my.cnf # 挂载MySQL配置文件
      - ./mysql/data:/var/lib/mysql # 挂载MySQL数据目录到本地
      - ./mysql/log:/var/log/mysql # 挂载MySQL日志目录到本地
    networks:
      app_net:
        ipv4_address: 192.168.12.11
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # redis 容器
  redis:
    container_name: tuoluojiang_redis
    image: ccr.ccs.tencentyun.com/tuoluojiang/redis:latest
    # build: ./redis
    ports:
      - "6379:6379"
    # command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      # - ./redis/redis.conf:/usr/local/etc/redis/redis.conf # 挂载Redis配置文件
      - ./redis/data:/data # 挂载Redis数据目录到本地
      - ./redis/log:/var/log/redis # 挂载Redis日志目录到本地
    networks:
      app_net:
        ipv4_address: 192.168.12.10
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # php 容器
  phpfpm:
    container_name: tuoluojiang_php
    image: ccr.ccs.tencentyun.com/tuoluojiang/php:latest
    # build: ./php
    restart: always
    environment:
      TZ: Asia/Shanghai
      # 数据库配置环境变量
      MYSQL_HOST_IP: tuoluojiang_mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: tuoluojiang
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: tuoluojiang
      # Redis配置环境变量
      REDIS_HOST_IP: tuoluojiang_redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: "123456"
      # 应用配置环境变量
      APP_DEBUG: true
      DEFAULT_TIMEZONE: Asia/Shanghai
    ports:
      - "9000:9000"
      - "20200:20200"
    working_dir: /var/www
    volumes:
      - ../../:/var/www # 程序运行目录
      - ../../runtime:/var/www/runtime # 程序缓存目录
      - ../../storage:/var/www/storage # 系统文件上传目录
      # - ./php/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini # 挂载PHP配置文件
      - ./php/log:/var/log/php # 挂载PHP日志目录到本地
    networks:
      app_net:
        ipv4_address: 192.168.12.90
    depends_on:
      - mysql
      - redis
    command: bin/laravels start --ignore
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20200"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # nginx 容器
  nginx:
    container_name: tuoluojiang_nginx
    image: ccr.ccs.tencentyun.com/tuoluojiang/nginx:latest
    # build: ./nginx
    restart: always
    ports:
      - "8022:80"
    # 依赖关系 先跑php
    depends_on:
      - phpfpm
    environment:
      TZ: Asia/Shanghai
    working_dir: /var/www
    volumes_from:
      - phpfpm # 继承phpfpm挂载目录
    volumes:
      # - ./nginx/vhost.conf:/etc/nginx/conf.d/default.conf # 挂载Nginx配置文件
      - ./nginx/log:/var/log/nginx # 挂载Nginx日志目录到本地
    networks:
      app_net:
        ipv4_address: 192.168.12.80
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

networks: #网络配置
  app_net: #网络名称
    driver: bridge
    ipam: #网络配置
      driver: default
      config:
        - subnet: 192.168.12.0/24 #IP区间