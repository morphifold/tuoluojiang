server {
    listen 80;
    index index.php index.html;
    server_name _;
    root /var/www/public;

    # Gzip compression
    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json application/vnd.ms-fontobject font/ttf font/opentype font/x-woff font/woff2 image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "MSIE [1-6]\.";

    # CORS origin handling
    set $cors_origin "*";
    if ($http_origin != "") {
        set $cors_origin $http_origin;
    }

    # Static files: images, fonts, scripts, styles, media
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|bmp|swf|svg|woff|woff2|ttf|eot|otf|webp|map|json|txt|pdf)$ {
        gzip_static on;
        expires 30d;
        error_log off;
        access_log off;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD' always;
        add_header Access-Control-Allow-Headers 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,token,Form-Type,AppVersion,laravel_lang,x-wps-weboffice-token,x-weboffice-file-id,X-Token' always;
        add_header Access-Control-Expose-Headers 'Authorization,token,Content-Disposition,Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD' always;
            add_header Access-Control-Allow-Headers 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,token,Form-Type,AppVersion,laravel_lang,x-wps-weboffice-token,x-weboffice-file-id,X-Token' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Proxy PHP/scripts
    location ~* \.(php|jsp|cgi|asp|aspx)$ 
    {
        proxy_pass http://localhost:20200;
        proxy_redirect ~^http://[^/]+/(.*)$ http://$http_host/$1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header REMOTE-HOST $remote_addr;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD' always;
        add_header Access-Control-Allow-Headers 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,token,Form-Type,AppVersion,laravel_lang,x-wps-weboffice-token,x-weboffice-file-id,X-Token' always;
        add_header Access-Control-Expose-Headers 'Authorization,token,Content-Disposition,Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD' always;
            add_header Access-Control-Allow-Headers 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,token,Form-Type,AppVersion,laravel_lang,x-wps-weboffice-token,x-weboffice-file-id,X-Token' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Proxy all dynamic requests
    location / 
    {
        proxy_pass http://localhost:20200;
        proxy_http_version 1.1;
        proxy_read_timeout 360s;   
        proxy_redirect ~^http://[^/]+/(.*)$ http://$http_host/$1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header REMOTE-HOST $remote_addr;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD' always;
        add_header Access-Control-Allow-Headers 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,token,Form-Type,AppVersion,laravel_lang,x-wps-weboffice-token,x-weboffice-file-id,X-Token' always;
        add_header Access-Control-Expose-Headers 'Authorization,token,Content-Disposition,Content-Length,Content-Range' always;

        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
        expires 12h;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD' always;
            add_header Access-Control-Allow-Headers 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,token,Form-Type,AppVersion,laravel_lang,x-wps-weboffice-token,x-weboffice-file-id,X-Token' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }
}
